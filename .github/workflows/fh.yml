name: fh
# Builds FNH (fh/) + FnH Menu UI Fabric Mod (mods/horizon -> fnh-menu-1.8.0.jar):
#   1. `menu-mod` compiles `fnh-menu-1.8.0.jar` for Minecraft 1.21.11 (Fabric) via Gradle + Loom.
#   2. `windows` builds native Windows x64 `FH.exe`, bundles `FH.exe` + `fnh-menu-1.8.0.jar` into
#      `FnHLauncher.zip`, and publishes both `FnHLauncher.zip` and standalone `fnh-menu-1.8.0.jar`
#      on the `fnh-v<VERSION>` GitHub Release.

on:
  push:
    branches: [main, 'fh-*', 'fh/**']
    paths:
      - 'fh/**'
      - 'mods/horizon/**'
      - 'launcher/**'
      - 'crates/**'
      - 'third_party/**'
      - '.github/workflows/fh.yml'
  pull_request:
    paths:
      - 'fh/**'
      - 'mods/horizon/**'
      - 'launcher/**'
      - 'crates/**'
      - 'third_party/**'
      - '.github/workflows/fh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fh-${{ github.ref }}
  cancel-in-progress: false

env:
  HORIZON_TELEMETRY_URL: "off"
  CARGO_TERM_COLOR: never

jobs:
  menu-mod:
    name: fnh-menu-jar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: Build fnh-menu-1.8.0.jar (Fabric 1.21.11)
        working-directory: mods/horizon
        run: |
          if gradle build --no-daemon --stacktrace > gradle-build.log 2>&1; then
            ls -lh build/libs/
            test -f build/libs/fnh-menu-1.8.0.jar
            python3 -c '
          import zipfile
          with zipfile.ZipFile("build/libs/fnh-menu-1.8.0.jar") as z:
              names = set(z.namelist())
              print("Jar entries:", len(names))
              assert "fabric.mod.json" in names, "missing fabric.mod.json"
              assert "fnh_ui.mixins.json" in names, "missing fnh_ui.mixins.json"
          '
            exit 0
          fi
          echo "::error::gradle build failed; gradle-build.log has $(wc -l < gradle-build.log) lines"
          tail -n 120 gradle-build.log
          exit 1
      - name: Post Gradle failure log
        if: failure()
        working-directory: mods/horizon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          body="### gradle-build.log"$'\n\n```\n'"$(tail -n 300 gradle-build.log 2>/dev/null || echo 'no log')"$'\n```\n'
          printf '%s' "$body" > comment.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: fnh-menu-1.8.0
          path: mods/horizon/build/libs/fnh-menu-1.8.0.jar
          if-no-files-found: error

  windows:
    needs: menu-mod
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: fh
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: true
      - uses: actions/download-artifact@v8
        with:
          name: fnh-menu-1.8.0
          path: fh/mod-dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          workspaces: fh
          shared-key: fh-windows
      - name: The version this build is
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Room on the drives
        run: |
          df -h
          echo "free space in the workspace's drive, in MB: $(df -m . | tail -1 | awk '{print $4}')"

      - name: Tests
        run: |
          if cargo test --release > cargo-test.log 2>&1; then
            exit 0
          fi
          echo "::error::cargo test failed; cargo-test.log has $(wc -l < cargo-test.log) lines"
          grep -E "^(error|thread|test .* \.\.\. FAILED)" -A8 cargo-test.log | head -n 80 > errors.txt || true
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            [ "$n" -gt 10 ] && break
            echo "::error::$(printf '%s' "$line" | cut -c1-350)"
          done < errors.txt
          exit 1

      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          if cargo build --release > cargo-build.log 2>&1; then
            exit 0
          fi
          echo "::error::cargo build failed; cargo-build.log has $(wc -l < cargo-build.log) lines"
          grep -E "^(error|warning)" -A8 cargo-build.log | head -n 80 > errors.txt || true
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            [ "$n" -gt 10 ] && break
            echo "::error::$(printf '%s' "$line" | cut -c1-350)"
          done < errors.txt
          exit 1

      - name: The version is the file's, and only the system's libraries are linked
        run: |
          set -euo pipefail
          out=$(./target/release/FH.exe --version)
          echo "$out"
          [[ "$out" == "FNH v$VERSION" ]] || { echo "::error::expected FNH v$VERSION"; exit 1; }
          python ../tools/check_pe_arch.py x64 ./target/release/FH.exe
          python ../tools/check_imports.py ./target/release/FH.exe
      - name: A double-click opens no console
        run: |
          set -euo pipefail
          python -c "
          import struct, sys
          data = open(sys.argv[1], 'rb').read()
          pe = struct.unpack_from('<I', data, 0x3C)[0]
          optional = pe + 24
          subsystem = struct.unpack_from('<H', data, optional + 68)[0]
          print('subsystem', subsystem)
          raise SystemExit(0 if subsystem == 2 else 1)
          " target/release/FH.exe
      - name: Package FnHLauncher.zip and fnh-menu-1.8.0.jar
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist/fnh
          cp target/release/FH.exe dist/fnh/
          cp mod-dist/fnh-menu-1.8.0.jar dist/fnh/
          cp mod-dist/fnh-menu-1.8.0.jar dist/fnh-menu-1.8.0.jar
          sed "s/@VERSION@/$VERSION/" pack/README.txt > dist/fnh/README.txt
          cd dist
          powershell -NoProfile -Command "Compress-Archive -Path 'fnh/*' -DestinationPath 'FnHLauncher.zip' -Force"
          ls -lh "FnHLauncher.zip" "fnh-menu-1.8.0.jar"
      - uses: actions/upload-artifact@v7
        with:
          name: FnHLauncher-${{ env.VERSION }}
          path: fh/dist/FnHLauncher.zip
          if-no-files-found: error
      - name: What failed, as a comment the failure can be read from
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          body=""
          for f in cargo-test.log cargo-build.log; do
            [ -f "$f" ] || continue
            body+="### $f: $(wc -l < "$f") lines, $(du -h "$f") ; the last 400"$'\n\n```\n'"$(tail -n 400 "$f")"$'\n```\n\n'
          done
          body+=$'### disk\n\n```\n'"$(df -h | tail -4)"$'\n```\n'
          [ -n "$body" ] || body="No cargo log was written: a step before cargo failed."
          printf '%s' "$body" > comment.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md > /dev/null

      - name: Publish fnh-v${{ env.VERSION }}
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="fnh-v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::$tag is published already: nothing to do (bump fh/VERSION)"
            exit 0
          fi
          gh release create "$tag" "dist/FnHLauncher.zip" "dist/fnh-menu-1.8.0.jar" \
            --title "FNH v$VERSION — The Menu UI Update" \
            --latest \
            --notes "FNH (Fabric n Horizon) v$VERSION — **The Menu UI Update** — made by Buffer.

          ### Downloads
          - **\`FnHLauncher.zip\`** — Native Windows x64 launcher (\`FH.exe\` v$VERSION) with \`fnh-menu-1.8.0.jar\` bundled and auto-installed into Fabric 1.21.11 instances (or update in 1 click from inside FnH).
          - **\`fnh-menu-1.8.0.jar\`** — Standalone Fabric 1.21.11 Menu UI mod: Minecraft's own UI layouts (\`TitleScreen\`, \`Options\`, \`Singleplayer\`, \`Create New World\`, \`Multiplayer\`, \`Mods\`) redesigned in FnH Dark Glass with stretched Milky Way animated background, custom background support, 3D walk-in player skin with cursor eye tracking, subtle rim glow, and smooth transitions.

          [Live Menu Preview](https://fnh.is-cool.dev/menupreview) · [fnh.is-cool.dev](https://fnh.is-cool.dev) · [Documentation](https://github.com/${{ github.repository }}/blob/main/fh/README.md)"
