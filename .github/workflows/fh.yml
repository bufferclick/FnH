name: fh
# Builds FNH (fh/ v1.9) + Universal Dark-Glass Resource Pack + Multi-Version Fabric UI Mods:
#   1. `menu-mod` compiles BOTH `fnh-menu-1.21.11-1.9.0.jar` (Fabric 1.21.11) AND
#      `fnh-menu-26.3-1.9.0.jar` (Fabric 26.x unobfuscated) via Gradle + Loom.
#   2. `windows` embeds `FnH-Dark-Glass.zip` + both Fabric UI jars directly inside `FH.exe`,
#      packages `FnHLauncher.zip`, and publishes `fnh-v<VERSION>` on GitHub Releases.

on:
  push:
    branches: [main, 'fh-*', 'fh/**']
    paths:
      - 'fh/**'
      - 'mods/horizon/**'
      - 'mods/fnh-ui-26/**'
      - 'launcher/**'
      - 'crates/**'
      - 'third_party/**'
      - '.github/workflows/fh.yml'
  pull_request:
    paths:
      - 'fh/**'
      - 'mods/horizon/**'
      - 'mods/fnh-ui-26/**'
      - 'launcher/**'
      - 'crates/**'
      - 'third_party/**'
      - '.github/workflows/fh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fh-${{ github.ref }}
  cancel-in-progress: false

env:
  HORIZON_TELEMETRY_URL: "off"
  CARGO_TERM_COLOR: never

jobs:
  menu-mod:
    name: fnh-menu-jars
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Build fnh-menu-1.21.11-1.9.0.jar (Fabric 1.21.11)
        working-directory: mods/horizon
        run: |
          if gradle build --no-daemon --stacktrace > gradle-12111.log 2>&1; then
            ls -lh build/libs/
            test -f build/libs/fnh-menu-1.21.11-1.9.0.jar
            python3 -c '
          import zipfile
          with zipfile.ZipFile("build/libs/fnh-menu-1.21.11-1.9.0.jar") as z:
              names = set(z.namelist())
              print("1.21.11 Jar entries:", len(names))
              assert "fabric.mod.json" in names
              assert "fnh_ui.mixins.json" in names
          '
            exit 0
          fi
          echo "::error::1.21.11 gradle build failed; gradle-12111.log has $(wc -l < gradle-12111.log) lines"
          tail -n 120 gradle-12111.log
          exit 1

      - name: Build fnh-menu-26.3-1.9.0.jar (Fabric 26.x)
        working-directory: mods/fnh-ui-26
        run: |
          if gradle build --no-daemon --stacktrace > gradle-26.log 2>&1; then
            ls -lh build/libs/
            test -f build/libs/fnh-menu-26.3-1.9.0.jar
            python3 -c '
          import zipfile
          with zipfile.ZipFile("build/libs/fnh-menu-26.3-1.9.0.jar") as z:
              names = set(z.namelist())
              print("26.x Jar entries:", len(names))
              assert "fabric.mod.json" in names
              assert "fnh_ui.mixins.json" in names
          '
            exit 0
          fi
          echo "::error::26.x gradle build failed; gradle-26.log has $(wc -l < gradle-26.log) lines"
          tail -n 120 gradle-26.log
          exit 1

      - name: Post Gradle failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          body=""
          for f in mods/horizon/gradle-12111.log mods/fnh-ui-26/gradle-26.log; do
            [ -f "$f" ] || continue
            body+="### $f"$'\n\n```\n'"$(tail -n 260 "$f")"$'\n```\n\n'
          done
          [ -n "$body" ] || body="No gradle log written."
          printf '%s' "$body" > comment.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md > /dev/null

      - name: Stage multi-version UI bundles
        run: |
          mkdir -p dist-bundles
          cp mods/horizon/build/libs/fnh-menu-1.21.11-1.9.0.jar dist-bundles/
          cp mods/fnh-ui-26/build/libs/fnh-menu-26.3-1.9.0.jar dist-bundles/
          cp fh/assets/FnH-Dark-Glass.zip dist-bundles/
          ls -lh dist-bundles/

      - uses: actions/upload-artifact@v7
        with:
          name: fnh-menu-bundles-1.9.0
          path: dist-bundles/*
          if-no-files-found: error

  windows:
    needs: menu-mod
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: fh
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: true
      - uses: actions/download-artifact@v8
        with:
          name: fnh-menu-bundles-1.9.0
          path: fh/assets
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          workspaces: fh
          shared-key: fh-windows
      - name: The version this build is
        run: |
          ls -lh assets/
          echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Room on the drives
        run: |
          df -h
          echo "free space in the workspace's drive, in MB: $(df -m . | tail -1 | awk '{print $4}')"

      - name: Tests
        run: |
          if cargo test --release > cargo-test.log 2>&1; then
            exit 0
          fi
          echo "::error::cargo test failed; cargo-test.log has $(wc -l < cargo-test.log) lines"
          grep -E "^(error|thread|test .* \.\.\. FAILED)" -A8 cargo-test.log | head -n 80 > errors.txt || true
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            [ "$n" -gt 10 ] && break
            echo "::error::$(printf '%s' "$line" | cut -c1-350)"
          done < errors.txt
          exit 1

      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          if cargo build --release > cargo-build.log 2>&1; then
            exit 0
          fi
          echo "::error::cargo build failed; cargo-build.log has $(wc -l < cargo-build.log) lines"
          grep -E "^(error|warning)" -A8 cargo-build.log | head -n 80 > errors.txt || true
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            [ "$n" -gt 10 ] && break
            echo "::error::$(printf '%s' "$line" | cut -c1-350)"
          done < errors.txt
          exit 1

      - name: The version is the file's, and only the system's libraries are linked
        run: |
          set -euo pipefail
          out=$(./target/release/FH.exe --version)
          echo "$out"
          [[ "$out" == "FNH v$VERSION" ]] || { echo "::error::expected FNH v$VERSION"; exit 1; }
          python ../tools/check_pe_arch.py x64 ./target/release/FH.exe
          python ../tools/check_imports.py ./target/release/FH.exe
      - name: A double-click opens no console
        run: |
          set -euo pipefail
          python -c "
          import struct, sys
          data = open(sys.argv[1], 'rb').read()
          pe = struct.unpack_from('<I', data, 0x3C)[0]
          optional = pe + 24
          subsystem = struct.unpack_from('<H', data, optional + 68)[0]
          print('subsystem', subsystem)
          raise SystemExit(0 if subsystem == 2 else 1)
          " target/release/FH.exe
      - name: Package FnHLauncher.zip and UI bundles
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist/fnh
          cp target/release/FH.exe dist/fnh/
          cp assets/FnH-Dark-Glass.zip dist/FnH-Dark-Glass.zip
          cp assets/fnh-menu-1.21.11-1.9.0.jar dist/fnh-menu-1.21.11-1.9.0.jar
          cp assets/fnh-menu-26.3-1.9.0.jar dist/fnh-menu-26.3-1.9.0.jar
          sed "s/@VERSION@/$VERSION/" pack/README.txt > dist/fnh/README.txt
          cd dist
          powershell -NoProfile -Command "Compress-Archive -Path 'fnh/*' -DestinationPath 'FnHLauncher.zip' -Force"
          ls -lh "FnHLauncher.zip" "FnH-Dark-Glass.zip" "fnh-menu-1.21.11-1.9.0.jar" "fnh-menu-26.3-1.9.0.jar"
      - uses: actions/upload-artifact@v7
        with:
          name: FnHLauncher-${{ env.VERSION }}
          path: fh/dist/FnHLauncher.zip
          if-no-files-found: error
      - name: What failed, as a comment the failure can be read from
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          body=""
          for f in cargo-test.log cargo-build.log; do
            [ -f "$f" ] || continue
            body+="### $f: $(wc -l < "$f") lines, $(du -h "$f") ; the last 400"$'\n\n```\n'"$(tail -n 400 "$f")"$'\n```\n\n'
          done
          body+=$'### disk\n\n```\n'"$(df -h | tail -4)"$'\n```\n'
          [ -n "$body" ] || body="No cargo log was written: a step before cargo failed."
          printf '%s' "$body" > comment.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md > /dev/null

      - name: Publish fnh-v${{ env.VERSION }}
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="fnh-v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::$tag is published already: nothing to do (bump fh/VERSION)"
            exit 0
          fi
          gh release create "$tag" \
            "dist/FnHLauncher.zip" \
            "dist/fnh-menu-1.21.11-1.9.0.jar" \
            "dist/fnh-menu-26.3-1.9.0.jar" \
            "dist/FnH-Dark-Glass.zip" \
            --title "FNH v$VERSION — Universal Dark-Glass UI (1.21.11, 26.3 & Horizon)" \
            --latest \
            --notes "FNH (Fabric n Horizon) v$VERSION — **Universal Dark-Glass UI Update** — made by Buffer.

          ### Highlights
          - **Universal Cross-Version & Horizon Support**: \`FH.exe\` now embeds and auto-activates \`FnH-Dark-Glass.zip\` across **all** Minecraft Java versions and **Horizon 26.3 (Rust)**, plus auto-installs version-matched dynamic Fabric mods for **Minecraft 1.21.11** (\`fnh-menu-1.21.11-1.9.0.jar\`) and **Minecraft 26.x / 26.3** (\`fnh-menu-26.3-1.9.0.jar\`).
          - **Crisp Anti-Aliased 3D Skin from Live Microsoft Account**: Pulls directly from Mojang's live \`sessionserver.mojang.com\` / \`textures.minecraft.net\` (never stale third-party caches) and renders via a 2×2 supersampled GPU \`DynamicTexture\` with dark-suit rim shading.
          - **Directional Motion-Blur Menu Transitions (Menus Only)**: Menus slide **up** when opening and **down** when closing with multi-sample vertical motion blur; **all** in-game screen/item animations are disabled so server containers (\`/ah\`) stay crisp and static.
          - **Dark-Glass In-Game HUD, Containers & Smooth Hotbar Glide**: Sleek dark-glass Inventory, Chests/\`/ah\`, Crafting, Furnace & Hotbar with sub-pixel smooth hotbar slot switching.
          - **GUI Scale Layout Lock & First-Launch Fix**: Logo, \`[FnH] EDITION\`, 3D skin, and buttons stay cohesively grouped at every GUI scale, and first-launch onboarding/fade glitches are fixed."
