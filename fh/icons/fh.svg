<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>FNH — Fabric n Horizon</title>
  <desc>F and H in deep navy with a black lowercase n tucked under the F's arm, on a light rounded tile.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f7fb"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="256" height="256" rx="56"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#plate)"/>
    <rect x="1.7" y="1.7" width="252.6" height="252.6" rx="54.3" fill="none" stroke="#d8dae5" stroke-width="3.4"/>
    <g fill="#131254" shape-rendering="crispEdges">
      <rect x="47" y="47" width="18" height="162"/>
      <rect x="65" y="47" width="72" height="18"/>
      <rect x="65" y="101" width="36" height="18"/>
      <rect x="155" y="47" width="18" height="162"/>
      <rect x="173" y="119" width="18" height="18"/>
      <rect x="191" y="47" width="18" height="162"/>
    </g>
    <g fill="#000000" shape-rendering="crispEdges">
      <rect x="83" y="137" width="18" height="72"/>
      <rect x="101" y="137" width="18" height="18"/>
      <rect x="119" y="137" width="18" height="72"/>
    </g>
  </g>
</svg>
