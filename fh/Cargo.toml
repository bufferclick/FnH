[package]
# Fabric n Horizon (FNH) — made by Buffer. JLac's Windows 11 launcher for Fabric and Horizon.
# The version here and fh/VERSION move together (a test checks it).
name = "horizon-fh"
version = "1.6.0"
edition = "2021"
authors = ["Buffer"]
license = "MIT"
description = "FNH (made by Buffer): JLac's Windows 11 launcher for Fabric and Horizon instances."
publish = false

# A workspace of its own, so the launcher's workspace and its lock file are untouched: this crate
# builds the multi-window Windows 11 launcher and uses `horizon-launcher` and `horizon-port-pack`.
[workspace]

[[bin]]
name = "FH"
path = "src/main.rs"

[dependencies]
# `xbox-sign-in`: Microsoft's own Xbox Live client, so sign-in needs no custom Azure app.
horizon-launcher = { path = "../launcher", features = ["xbox-sign-in"] }
horizon-port-pack = { path = "../crates/horizon-port-pack" }
gpui = { package = "gpui-fast", version = "0.1.13" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.13", features = ["wayland", "x11", "font-kit"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Same patches as the launcher's workspace so linked crates share identical copies.
[patch.crates-io]
wgpu-hal = { path = "../third_party/wgpu-hal" }
naga = { path = "../third_party/naga" }
libmimalloc-sys = { path = "../third_party/libmimalloc-sys" }

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.dev.package.horizon-mod-api-gen]
opt-level = 3
[profile.dev.package.syn]
opt-level = 3
[profile.dev.package.proc-macro2]
opt-level = 3
[profile.release.package.horizon-mod-api-gen]
opt-level = 3
[profile.release.package.syn]
opt-level = 3
[profile.release.package.proc-macro2]
opt-level = 3
